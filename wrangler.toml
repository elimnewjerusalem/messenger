name = "enjc-messenger"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The app (public/ folder) is served by the same Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Free database. After `wrangler d1 create enjc-messenger`, paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "enjc-messenger"
database_id = "PASTE-YOUR-DATABASE-ID-HERE"

# Every minute: send the next batch, run schedules and birthday wishes.
[triggers]
crons = ["* * * * *"]
